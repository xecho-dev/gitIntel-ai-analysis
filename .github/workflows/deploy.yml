# ============================================================
# GitIntel Deploy — 生产部署流水线
#
# 触发条件：
#   - main 分支的 push（合并 PR 或直接推送）
#
# 流程：
#   1. 构建前后端 Docker 镜像
#   2. 将镜像保存为 tar 文件
#   3. 通过 SSH/SCP 将 tar 文件传输到服务器
#   4. 服务器加载镜像并重启容器
#   5. 健康检查确认部署成功
#
# 需要的 Secrets（请在 GitHub 仓库 Settings > Secrets 中配置）：
#   SERVER_HOST          - 服务器 IP 或域名（如 gitintel.top 或 47.80.59.132）
#   SERVER_USER          - 服务器用户名（如 root 或 deploy）
#   SERVER_SSH_KEY      - SSH 私钥（用于连接服务器）
#   FRONTEND_URL         - 前端实际访问地址（必须包含协议，如 https://your-domain.com）
#   OPENAI_API_KEY       - OpenAI API 密钥
#   DATABASE_URL        - PostgreSQL 连接字符串
#   AUTH_SECRET          - NextAuth JWT 签名密钥
#   AUTH_GITHUB_ID       - GitHub OAuth App Client ID
#   AUTH_GITHUB_SECRET   - GitHub OAuth App Client Secret
#   AUTH_URL             - 前端访问地址（同 FRONTEND_URL，用于 OAuth 回调）
#   LANGSMITH_TRACING    - LangSmith 链路追踪开关（如 true）
#   LANGSMITH_ENDPOINT   - LangSmith API 端点（如 https://api.smith.langchain.com）
#   LANGSMITH_PROJECT    - LangSmith 项目名称
#   LANGSMITH_API_KEY    - LangSmith API Key
#   DASHVECTOR_API_KEY   - DashVector API 密钥
#   DASHVECTOR_ENDPOINT  - DashVector 服务地址（默认 dashvector.aliyuncs.com）
#   DASHVECTOR_COLLECTION - DashVector Collection 名称（默认 gitintel_knowledge）
# ============================================================

name: Deploy

on:
  push:
    branches: [main]
  # 手动触发 CD（需要先在 GitHub 仓库 Settings > Variables 中设置 DEPLOY_TO_SERVER = true）
  workflow_dispatch:
    inputs:
      deploy_to_server:
        description: "部署到服务器（需先配置 SERVER_SSH_KEY secret）"
        required: false
        default: "false"

env:
  REGISTRY: ghcr.io
  # 使用小写的仓库名作为镜像前缀
  IMAGE_PREFIX: ${{ github.repository_owner }}/gitintel
  DEPLOY_PATH: /opt/gitintel

jobs:
  # ==================== 构建 Docker 镜像 ====================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      frontend_image: ${{ steps.meta-frontend.outputs.tags }}
      admin_image: ${{ steps.meta-admin.outputs.tags }}
      backend_image: ${{ steps.meta-backend.outputs.tags }}
      commit_short: ${{ steps.vars.outputs.commit_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up variables
        id: vars
        run: echo "commit_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # --- 前端镜像构建 ---
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHP_TOKEN }}

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gitintel/frontend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./Dockerfile.frontend
          tags: ${{ steps.meta-frontend.outputs.tags }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gitintel/frontend:buildcache
          build-args: |
            NEXT_PUBLIC_API_URL=http://backend:8000
            NEXT_PUBLIC_AUTH_URL=${{ secrets.FRONTEND_URL }}
            AUTH_GITHUB_ID=${{ secrets.AUTH_GITHUB_ID }}
            AUTH_GITHUB_SECRET=${{ secrets.AUTH_GITHUB_SECRET }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            AUTH_URL=${{ secrets.FRONTEND_URL }}

      # --- Admin 镜像构建 ---
      - name: Extract metadata (admin)
        id: meta-admin
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gitintel/admin
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push admin
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./Dockerfile.admin
          tags: ${{ steps.meta-admin.outputs.tags }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gitintel/admin:buildcache

      # --- 后端镜像构建 ---
      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gitintel/backend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./Dockerfile.backend
          tags: ${{ steps.meta-backend.outputs.tags }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gitintel/backend:buildcache

  # ==================== 部署到服务器 ====================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      contents: read
      packages: read
      # 仅在 GitHub variable DEPLOY_TO_SERVER=true 时触发
    if: ${{ github.event.inputs.deploy_to_server == 'true' || (github.event_name == 'push' && vars.DEPLOY_TO_SERVER == 'true') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy/
          sparse-checkout-cone-mode: false

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # --- 用 Python 准备所有部署文件 ---
      - name: Prepare and upload deploy files
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          REGISTRY: ${{ env.REGISTRY }}
          REPO_LOWER: ${{ github.repository_owner }}/gitintel
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHP_TOKEN }}
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gitintel/frontend:latest
          ADMIN_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gitintel/admin:latest
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/gitintel/backend:latest
          DEPLOY_PATH: /opt/gitintel
          COMMIT_SHORT: ${{ needs.build.outputs.commit_short }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GHP_TOKEN }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          DASHVECTOR_API_KEY: ${{ secrets.DASHVECTOR_API_KEY }}
          DASHVECTOR_ENDPOINT: ${{ secrets.DASHVECTOR_ENDPOINT }}
          DASHVECTOR_COLLECTION: ${{ secrets.DASHVECTOR_COLLECTION }}
        run: |
          python3 << 'PYEOF'
          import os

          vals = {
              'DEPLOY_PATH': os.environ['DEPLOY_PATH'],
              'SERVER_USER': os.environ['SERVER_USER'],
              'REGISTRY': os.environ['REGISTRY'],
              'REPO_LOWER': os.environ['REPO_LOWER'],
              'FRONTEND_IMAGE': os.environ['FRONTEND_IMAGE'],
              'ADMIN_IMAGE': os.environ['ADMIN_IMAGE'],
              'BACKEND_IMAGE': os.environ['BACKEND_IMAGE'],
              'REGISTRY_USERNAME': os.environ['REGISTRY_USERNAME'],
              'REGISTRY_TOKEN': os.environ['REGISTRY_TOKEN'],
              'COMMIT_SHORT': os.environ['COMMIT_SHORT'],
              'POSTGRES_PASSWORD': os.environ['POSTGRES_PASSWORD'],
              'OPENAI_API_KEY': os.environ['OPENAI_API_KEY'],
              'OPENAI_BASE_URL': os.environ['OPENAI_BASE_URL'],
              'GITHUB_TOKEN': os.environ['GITHUB_TOKEN'],
              'FRONTEND_URL': os.environ['FRONTEND_URL'],
              'AUTH_SECRET': os.environ['AUTH_SECRET'],
              'AUTH_GITHUB_ID': os.environ['AUTH_GITHUB_ID'],
              'AUTH_GITHUB_SECRET': os.environ['AUTH_GITHUB_SECRET'],
              'LANGSMITH_TRACING': os.environ['LANGSMITH_TRACING'],
              'LANGSMITH_ENDPOINT': os.environ['LANGSMITH_ENDPOINT'],
              'LANGSMITH_PROJECT': os.environ['LANGSMITH_PROJECT'],
              'LANGSMITH_API_KEY': os.environ['LANGSMITH_API_KEY'],
              'DASHVECTOR_API_KEY': os.environ['DASHVECTOR_API_KEY'],
              'DASHVECTOR_ENDPOINT': os.environ['DASHVECTOR_ENDPOINT'],
              'DASHVECTOR_COLLECTION': os.environ['DASHVECTOR_COLLECTION'],
          }

          # 1) 写 .env 文件
          env_content = '\n'.join(f'{k}={v}' for k, v in vals.items()) + '\n'
          with open('/tmp/gitintel.env', 'w') as f:
              f.write(env_content)
          print('[OK] gitintel.env written')

          # 2) 替换 deploy-template.sh 中的 __VAR__ 占位符
          with open('deploy/deploy-template.sh', 'r') as f:
              script = f.read()
          for k, v in vals.items():
              script = script.replace(f'__{k}__', v)
          with open('/tmp/gitintel_deploy.sh', 'w') as f:
              f.write(script)
          print('[OK] deploy.sh written')
          PYEOF

          scp -o StrictHostKeyChecking=no \
            /tmp/gitintel.env \
            "$SERVER_USER@$SERVER_HOST:/tmp/gitintel.env"

          scp -o StrictHostKeyChecking=no \
            deploy/nginx.conf \
            "$SERVER_USER@$SERVER_HOST:/tmp/gitintel.conf"

          scp -o StrictHostKeyChecking=no \
            /tmp/gitintel_deploy.sh \
            "$SERVER_USER@$SERVER_HOST:/tmp/gitintel_deploy.sh"

          ssh -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_HOST" \
            "chmod +x /tmp/gitintel_deploy.sh && bash /tmp/gitintel_deploy.sh"

