# ============================================================
# GitIntel — Docker Compose 部署配置
#
# 用法：
#   1. 复制 .env.example 为 .env，填入真实密钥
#   2. 首次运行：docker compose up -d postgres-init（执行数据库迁移）
#   3. 完整启动：docker compose up -d --build
#   4. 访问：http://<服务器IP>:3000
# ============================================================

services:
  # ── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gitintel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitintel
      POSTGRES_USER: gitintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitintel_dev_password}
    volumes:
      # 持久化数据
      - postgres_data:/var/lib/postgresql/data
      # 自动执行数据库初始化脚本（PostgreSQL 仅在首次启动时执行）
      # 只挂载统一的初始化脚本，避免 Supabase 特有语法的旧迁移文件干扰
      - ./db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    networks:
      - gitintel-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gitintel", "-d", "gitintel"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Frontend — Next.js 15 ────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
        NEXT_PUBLIC_AUTH_URL: ${AUTH_URL:-http://localhost:3000}
    container_name: gitintel-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./deploy.env
    environment:
      NODE_ENV: production
      AUTH_TRUST_HOST: "true"
    networks:
      - gitintel-net
    depends_on:
      - backend

  # ── Admin — Umi.js ───────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: gitintel-admin
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
    networks:
      - gitintel-net
    depends_on:
      - backend

  # ── Backend — FastAPI Agent Layer ────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gitintel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./deploy.env
    environment:
      DATABASE_URL: postgresql://gitintel:${POSTGRES_PASSWORD:-gitintel_dev_password}@postgres:5432/gitintel
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen3.7-plus-2026-05-26}
      DASHVECTOR_API_KEY: ${DASHVECTOR_API_KEY}
      DASHVECTOR_ENDPOINT: ${DASHVECTOR_ENDPOINT:-dashvector.aliyuncs.com}
      DASHVECTOR_COLLECTION: ${DASHVECTOR_COLLECTION:-gitintel_knowledge}
      DASHVECTOR_COLLECTION_KNOWLEDGE: ${DASHVECTOR_COLLECTION_KNOWLEDGE:-gitintel_knowledge}
      DASHVECTOR_COLLECTION_MEMORY: ${DASHVECTOR_COLLECTION_MEMORY:-gitintel_memory}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
    networks:
      - gitintel-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  gitintel-net:
    driver: bridge

volumes:
  postgres_data:
